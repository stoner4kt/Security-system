# Supabase CLI configuration for local development.
# Docs: https://supabase.com/docs/guides/cli/config

project_id = "sentinel-fleet"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = false

[realtime]
enabled = true

[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://*.pages.dev"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
email_otp_enabled = false
sms_provider = "logfire"

[edge_runtime]
enabled = true
policy = "on_demand"
verify_jwt = false

[functions.validate-location]
verify_jwt = false
enabled = true

[functions.send-incident-alert]
verify_jwt = false
enabled = true

[functions.daily-shift-summary]
verify_jwt = false
enabled = true

[functions.cloudinary-sign]
verify_jwt = false
enabled = true